name: Build - NovaPro Image

on:
    push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '*.md'
      - 'docker-compose*.yml'
    workflow_dispatch:

concurrency:
    group: novapro-image-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

env:
    IMAGE_NAME: ghcr.io/akolenda/solidtime

jobs:
    publish:
        if: github.repository == 'AKolenda/solidtime'
        runs-on: ubuntu-24.04
        timeout-minutes: 90

        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Prepare production environment
              shell: bash
              run: |
                  cp .env.production .env
                  rm .env.production .env.ci .env.example
                  sed -i "s/APP_VERSION=0.0.0/APP_VERSION=novapro/" .env
                  sed -i "s/APP_BUILD=0/APP_BUILD=${GITHUB_SHA::8}/" .env

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: mbstring, dom, fileinfo, pgsql

            - name: Install production PHP dependencies
              run: >-
                  composer install
                  --no-dev
                  --no-ansi
                  --no-interaction
                  --prefer-dist
                  --ignore-platform-reqs
                  --classmap-authoritative

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '20.x'
                  cache: npm

            - name: Install frontend dependencies
              run: npm ci

            - name: Build frontend assets
              run: npm run build

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate image tags and labels
              id: metadata
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix=sha-,format=short

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and publish image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/prod/Dockerfile
                  build-args: DOCKER_FILES_BASE_PATH=docker/prod/
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
